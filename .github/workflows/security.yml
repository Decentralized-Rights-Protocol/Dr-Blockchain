name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      
      - name: Determine TruffleHog scan range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            base="$EVENT_BEFORE"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          head="$GITHUB_SHA"
          if [[ -z "$base" || "$base" == "$head" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          extra_args: --debug --only-verified
      
      - name: Check for private keys
        run: |
          echo "Checking for private key files..."
          if find . -name "*.priv" -o -name "*.pem" -o -name "*.key" -o -name "*.keystore" | grep -v node_modules | grep -v .venv; then
            echo "❌ Private key files found!"
            exit 1
          else
            echo "✅ No private key files found"
          fi
      
      - name: Check for hardcoded secrets
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          skip_parts = {".git", "node_modules", ".venv", "venv", "__pycache__"}
          placeholders = re.compile(r"(?i)(example|your_|mock_|changeme|replace[_-]?me|dummy|placeholder)")
          patterns = [
              ("hardcoded password", re.compile(r"""(?i)\bpassword\s*[:=]\s*["']([^"']{4,})["']""")),
              ("hardcoded API key", re.compile(r"""(?i)\b(?:api[_-]?key|secret[_-]?key|access[_-]?token)\s*[:=]\s*["']([A-Za-z0-9_./+=-]{16,})["']""")),
          ]
          findings = []
          allowed_suffixes = {".py", ".js", ".ts", ".tsx", ".json", ".yml", ".yaml"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in allowed_suffixes:
                  continue
              if "example" in path.name.lower() or "test" in path.name.lower():
                  continue
              try:
                  source = path.read_text(errors="ignore")
              except OSError:
                  continue
              for label, pattern in patterns:
                  for match in pattern.finditer(source):
                      if not placeholders.search(match.group(1)):
                          findings.append((path, label))
          if findings:
              for path, label in findings:
                  print(f"{path}: possible {label} literal")
              sys.exit(1)
          print("No hardcoded secret literals detected.")
          PY

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
      
      - name: Run safety check
        run: |
          safety check --json --output safety-report.json || true
          if [ -f safety-report.json ]; then
            echo "Safety report generated"
            cat safety-report.json
          fi
      
      - name: Run bandit security linter
        run: |
          bandit -r . -f json -o bandit-report.json || true
          if [ -f bandit-report.json ]; then
            echo "Bandit report generated"
            cat bandit-report.json
          fi
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install npm dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi
      
      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=moderate || true
          fi

  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run repository syntax checks
        run: python -m compileall -q .

      - name: Run critical checks on protocol-facing modules
        run: |
          flake8 app/routers/scoring.py ai/quantum_security.py audit/logger.py hybrid-orbitdb-ipfs/backend/scylla_sync_worker.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run black check on maintained modules
        run: |
          black --check --diff app/routers/scoring.py ai/quantum_security.py hybrid-orbitdb-ipfs/backend/scylla_sync_worker.py

      - name: Run isort check on maintained modules
        run: |
          isort --check-only --diff app/routers/scoring.py ai/quantum_security.py hybrid-orbitdb-ipfs/backend/scylla_sync_worker.py
      
      - name: Run mypy
        run: |
          mypy . --ignore-missing-imports || true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi
      
      - name: Run ESLint
        run: |
          if [ -f package.json ] && [ -f .eslintrc.js ]; then
            npm run lint || true
          fi
      
      - name: Run TypeScript check
        run: |
          if [ -f package.json ] && [ -f tsconfig.json ]; then
            npm run type-check || true
          fi

  security-test:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies (CI)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest pytest-cov
      
      - name: Run security tests
        run: |
          python -m py_compile app/routers/scoring.py ai/quantum_security.py audit/logger.py hybrid-orbitdb-ipfs/backend/scylla_sync_worker.py test_system.py notebooks/drp_scoring_model.py
          python - <<'PY'
          import importlib

          checks = [
              ("storage.ipfs_handler", "IPFSHandler"),
              ("db.indexer", "ScyllaIndexer"),
              ("ledger.anchor", "BlockchainAnchor"),
              ("security.encryption", "EncryptionManager"),
          ]
          for module_name, symbol_name in checks:
              try:
                  module = importlib.import_module(module_name)
                  getattr(module, symbol_name)
                  print(f"{module_name}: import available")
              except Exception as exc:
                  print(f"{module_name}: optional import unavailable ({exc})")
          PY

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: security
          name: security-coverage

  notify-security:
    name: Security Notification
    runs-on: ubuntu-latest
    if: failure()
    needs: [secret-scan, dependency-scan, code-quality, security-test]
    steps:
      - name: Notify security team
        run: |
          echo "🚨 Security scan failed!"
          echo "Please check the security scan results and address any issues."
          echo "Contact: security@drp-protocol.org"
