name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install and run Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.25.0
          "$(go env GOPATH)/bin/gitleaks" dir . --redact --no-banner --verbose --exit-code 1
      
      - name: Check for private keys
        run: |
          echo "Checking for private key files..."
          if find . -name "*.priv" -o -name "*.pem" -o -name "*.key" -o -name "*.keystore" | grep -v node_modules | grep -v .venv; then
            echo "CRITICAL: Private key files found in repository!"
            echo "Please remove all private key files and follow KEY_ROTATION.md"
            exit 1
          else
            echo "No private key files found"
          fi

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run black check
        run: |
          black --check --diff .
      
      - name: Run isort check
        if: ${{ !cancelled() }}
        run: |
          isort --check-only --diff .
      
      - name: Run mypy
        run: |
          mypy . --ignore-missing-imports || true

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run Python tests
        run: python -m pytest tests/ infrastructure/testing/tests/ infrastructure/testing/tests_ai/ -v -rs --cov=. --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage

  chain-build-test:
    name: DRP Chain Build & Tests
    runs-on: ubuntu-latest
    needs: security-check
    defaults:
      run:
        working-directory: chain
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: true
          cache-dependency-path: chain/go.mod

      - name: Download Go modules
        run: go mod download all

      - name: Record pinned dependency versions and verify modules
        run: |
          go version
          go list -m github.com/cosmos/cosmos-sdk github.com/cometbft/cometbft
          go mod verify

      - name: Install pinned protobuf generators
        run: |
          curl --fail --location --retry 2 \
            https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip \
            --output "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "PROTOC_INCLUDE=$RUNNER_TEMP/protoc/include" >> "$GITHUB_ENV"
          go install github.com/cosmos/gogoproto/protoc-gen-gocosmos@v1.7.2
          go install github.com/grpc-ecosystem/grpc-gateway/protoc-gen-grpc-gateway@v1.16.0

      - name: Generate Cosmos protobuf messages and services
        run: make proto-gen

      - name: Upload generated sources and dependency checksums
        uses: actions/upload-artifact@v4
        with:
          name: chain-generated
          path: |
            chain/x/**/*.pb.go
            chain/x/**/*.pb.gw.go
            chain/go.sum

      - name: Verify generated sources and go.sum are committed
        run: |
          git add --intent-to-add x go.sum
          git diff --exit-code -- x go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l app cmd x)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run chain tests
        run: go test ./... -count=1

      - name: Build drpd binary
        run: |
          go build ./cmd/drpd
          mkdir -p build
          mv drpd build/drpd

      - name: Validate localnet startup, RPC, and restart
        run: python3 scripts/ci_localnet.py

  build-and-test:
    name: Build & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-backend, chain-build-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run integration tests
        run: |
          if [ -f "examples/ai_verification_demo.py" ]; then
            python examples/ai_verification_demo.py --demo || true
          fi
          
          if [ -f "examples/security_demos/advanced_security_demo.py" ]; then
            python examples/security_demos/advanced_security_demo.py --demo || true
          fi
      
      - name: Create build artifacts
        run: |
          mkdir -p build-artifacts
          if [ -d "dist" ]; then
            cp -r dist build-artifacts/python
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Preserve Trivy SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
