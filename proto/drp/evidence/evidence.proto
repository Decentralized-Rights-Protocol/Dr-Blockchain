syntax = "proto3";
package drp.evidence;

option go_package = "github.com/decentralized-rights-protocol/drp/chain/x/evidence/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "google/api/annotations.proto";

// Transactions are wire types only; mutation handlers remain disabled pending
// authorization rules and protocol state transitions.
service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc AnchorEvidence(MsgAnchorEvidence) returns (MsgAnchorEvidenceResponse);
  rpc RevokeEvidence(MsgRevokeEvidence) returns (MsgRevokeEvidenceResponse);
}

message MsgAnchorEvidence {
  string submitter = 1 [(gogoproto.customname) = "Submitter", (gogoproto.jsontag) = "submitter"];
  string cid = 2 [(gogoproto.customname) = "CID", (gogoproto.jsontag) = "cid"];
  string content_hash = 3 [(gogoproto.customname) = "ContentHash", (gogoproto.jsontag) = "content_hash"];
  string metadata_hash = 4 [(gogoproto.customname) = "MetadataHash", (gogoproto.jsontag) = "metadata_hash"];
  string evidence_type = 5 [(gogoproto.customname) = "EvidenceType", (gogoproto.jsontag) = "evidence_type"];
}
message MsgAnchorEvidenceResponse {}

message MsgRevokeEvidence {
  string authority = 1 [(gogoproto.customname) = "Authority", (gogoproto.jsontag) = "authority"];
  string commitment_id = 2 [(gogoproto.customname) = "CommitmentID", (gogoproto.jsontag) = "commitment_id"];
  string reason = 3 [(gogoproto.customname) = "Reason", (gogoproto.jsontag) = "reason"];
}
message MsgRevokeEvidenceResponse {}

// Opaque JSON scaffolding: records retain the existing keeper JSON format.
// Params is intentionally unimplemented: genesis parameters are not persisted.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/drp/evidence/params";
  }
  rpc Commitment(QueryCommitmentRequest) returns (QueryCommitmentResponse) {
    option (google.api.http).get = "/drp/evidence/{commitment_id}";
  }
}
message QueryParamsRequest {}
message QueryParamsResponse { bytes params_json = 1; }
message QueryCommitmentRequest {
  string commitment_id = 1;
}
message QueryCommitmentResponse { bytes record_json = 1; }
