syntax = "proto3";
package drp.poat;

option go_package = "github.com/decentralized-rights-protocol/drp/chain/x/poat/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "google/api/annotations.proto";

// Transactions are wire types only; mutation handlers remain disabled pending
// authorization rules and protocol state transitions.
service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc SubmitActivityProof(MsgSubmitActivityProof) returns (MsgSubmitActivityProofResponse);
  rpc RevokeActivityProof(MsgRevokeActivityProof) returns (MsgRevokeActivityProofResponse);
}

message MsgSubmitActivityProof {
  string submitter = 1 [(gogoproto.customname) = "Submitter", (gogoproto.jsontag) = "submitter"];
  string commitment_cid = 2 [(gogoproto.customname) = "CommitmentCID", (gogoproto.jsontag) = "commitment_cid"];
  string proof_type = 3 [(gogoproto.customname) = "ProofType", (gogoproto.jsontag) = "proof_type"];
  string metadata_hash = 4 [(gogoproto.customname) = "MetadataHash", (gogoproto.jsontag) = "metadata_hash"];
}
message MsgSubmitActivityProofResponse {}

message MsgRevokeActivityProof {
  string authority = 1 [(gogoproto.customname) = "Authority", (gogoproto.jsontag) = "authority"];
  string proof_id = 2 [(gogoproto.customname) = "ProofID", (gogoproto.jsontag) = "proof_id"];
  string reason = 3 [(gogoproto.customname) = "Reason", (gogoproto.jsontag) = "reason"];
}
message MsgRevokeActivityProofResponse {}

// Opaque JSON scaffolding: records retain the existing keeper JSON format.
// Params is intentionally unimplemented: genesis parameters are not persisted.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/drp/poat/params";
  }
  rpc ActivityProof(QueryActivityProofRequest) returns (QueryActivityProofResponse) {
    option (google.api.http).get = "/drp/poat/{proof_id}";
  }
}
message QueryParamsRequest {}
message QueryParamsResponse { bytes params_json = 1; }
message QueryActivityProofRequest {
  string proof_id = 1;
}
message QueryActivityProofResponse { bytes record_json = 1; }
