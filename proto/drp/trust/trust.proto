syntax = "proto3";
package drp.trust;

option go_package = "github.com/decentralized-rights-protocol/drp/chain/x/trust/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "google/api/annotations.proto";

// Transactions are wire types only; mutation handlers remain disabled pending
// authorization rules and protocol state transitions.
service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc UpdateTrustState(MsgUpdateTrustState) returns (MsgUpdateTrustStateResponse);
}

message MsgUpdateTrustState {
  string authority = 1 [(gogoproto.customname) = "Authority", (gogoproto.jsontag) = "authority"];
  string address = 2 [(gogoproto.customname) = "Address", (gogoproto.jsontag) = "address"];
  int64 score_delta = 3 [(gogoproto.customname) = "ScoreDelta", (gogoproto.jsontag) = "score_delta"];
  string activity_ref = 4 [(gogoproto.customname) = "ActivityRef", (gogoproto.jsontag) = "activity_ref"];
}
message MsgUpdateTrustStateResponse {}

// Opaque JSON scaffolding: records retain the existing keeper JSON format.
// Params is intentionally unimplemented: genesis parameters are not persisted.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/drp/trust/params";
  }
  rpc TrustState(QueryTrustStateRequest) returns (QueryTrustStateResponse) {
    option (google.api.http).get = "/drp/trust/{address}";
  }
}
message QueryParamsRequest {}
message QueryParamsResponse { bytes params_json = 1; }
message QueryTrustStateRequest {
  string address = 1 [(gogoproto.customname) = "Address"];
}
message QueryTrustStateResponse { bytes record_json = 1; }
