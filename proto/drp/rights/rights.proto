syntax = "proto3";
package drp.rights;

option go_package = "github.com/decentralized-rights-protocol/drp/chain/x/rights/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "google/api/annotations.proto";

// Transactions are wire types only; mutation handlers remain disabled pending
// authorization rules and protocol state transitions.
service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc SubmitRightsProposal(MsgSubmitRightsProposal) returns (MsgSubmitRightsProposalResponse);
}

message MsgSubmitRightsProposal {
  string proposer = 1 [(gogoproto.customname) = "Proposer", (gogoproto.jsontag) = "proposer"];
  string title = 2 [(gogoproto.customname) = "Title", (gogoproto.jsontag) = "title"];
  string description = 3 [(gogoproto.customname) = "Description", (gogoproto.jsontag) = "description"];
  string rights_category = 4 [(gogoproto.customname) = "RightsCategory", (gogoproto.jsontag) = "rights_category", (gogoproto.casttype) = "RightsCategory"];
  string evidence_cid = 5 [(gogoproto.customname) = "EvidenceCID", (gogoproto.jsontag) = "evidence_cid,omitempty"];
  string impact_statement = 6 [(gogoproto.customname) = "ImpactStatement", (gogoproto.jsontag) = "impact_statement,omitempty"];
}
message MsgSubmitRightsProposalResponse {}

// Opaque JSON scaffolding: records retain the existing keeper JSON format.
// Params is intentionally unimplemented: genesis parameters are not persisted.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/drp/rights/params";
  }
  rpc Proposal(QueryProposalRequest) returns (QueryProposalResponse) {
    option (google.api.http).get = "/drp/rights/{proposal_id}";
  }
}
message QueryParamsRequest {}
message QueryParamsResponse { bytes params_json = 1; }
message QueryProposalRequest {
  uint64 proposal_id = 1;
}
message QueryProposalResponse { bytes record_json = 1; }
