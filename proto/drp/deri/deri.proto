syntax = "proto3";

package drp.deri;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/decentralized-rights-protocol/drp/chain/x/deri/types";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc Transfer(MsgTransfer) returns (MsgTransferResponse);
  rpc Mint(MsgMint) returns (MsgMintResponse);
  rpc Burn(MsgBurn) returns (MsgBurnResponse);
}

service Query {
  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse) {
    option (google.api.http).get = "/drp/deri/balances/{address}";
  }
  rpc TotalSupply(QueryTotalSupplyRequest) returns (QueryTotalSupplyResponse) {
    option (google.api.http).get = "/drp/deri/total_supply";
  }
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/drp/deri/params";
  }
}

message MsgTransfer {
  option (cosmos.msg.v1.signer) = "from";
  string from = 1;
  string to = 2;
  string amount = 3;
}
message MsgTransferResponse {
  bool success = 1;
  string error = 2;
}
message MsgMint {
  option (cosmos.msg.v1.signer) = "signer";
  string to = 1;
  string amount = 2;
  string reason = 3;
  string signer = 4;
}
message MsgMintResponse {
  bool success = 1;
  string error = 2;
  string minted_amount = 3;
}
message MsgBurn {
  option (cosmos.msg.v1.signer) = "from";
  string from = 1;
  string amount = 2;
  string reason = 3;
}
message MsgBurnResponse {
  bool success = 1;
  string error = 2;
  string burned_amount = 3;
}

message QueryBalanceRequest { string address = 1; }
message QueryBalanceResponse { string balance = 1; }
message QueryTotalSupplyRequest {}
message QueryTotalSupplyResponse { string total_supply = 1; }
message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message Params {
  int64 max_per_block = 1;
  int64 max_per_epoch = 2;
  int64 max_per_activity = 3;
  int64 max_per_identity = 4;
  string denom = 5;
}
message MintRecord {
  int64 height = 1;
  string to = 2;
  string amount = 3;
  string reason = 4;
  int64 timestamp = 5;
}
message BurnRecord {
  int64 height = 1;
  string from = 2;
  string amount = 3;
  string reason = 4;
  int64 timestamp = 5;
}
message BalanceGenesis {
  string address = 1;
  string amount = 2;
}
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated BalanceGenesis balances = 2 [(gogoproto.nullable) = false];
  string total_supply = 3;
  repeated MintRecord mint_history = 4 [(gogoproto.nullable) = false];
  repeated BurnRecord burn_history = 5 [(gogoproto.nullable) = false];
}
